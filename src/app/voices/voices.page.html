<ion-content [fullscreen]="true">
    <div class="container">
        <ion-select label="Selecione o narrador" placeholder="Narrador" (ionChange)="onVoiceChange($event)"
            [value]="voiceOption">
            <ion-select-option value="narakeet">Felipe</ion-select-option>
            <ion-select-option value="ttsmp3">Onyx</ion-select-option>
        </ion-select>
        <h3>Escolha os Personagens</h3>
        <br>
    </div>

    <ion-list>
        <ion-item-sliding *ngFor="let p of charactersList">

            <ion-item>
                <div class="personagem mini" id="home_{{p.name}}"
                    style="background-image: url('assets/sprites/{{p.img}}');">
                </div>
                <ion-label>{{p.originalOrder}} - {{p.name}} | ({{ p.interval/1000 }}seg)</ion-label>
            </ion-item>

            <ion-item-options>
                <ion-item-option color="success" (click)="play(p.slug, p.interval)">
                    <ion-col>
                        <ion-row style="display: block">
                            <ion-icon name="play" class="button-icon"></ion-icon>
                        </ion-row>
                        <ion-row>Play</ion-row>
                    </ion-col>
                </ion-item-option>
            </ion-item-options>
        </ion-item-sliding>
        <ion-item-sliding *ngFor="let p of vampireList">

            <ion-item>
                <div class="personagem mini" id="home_{{p.name}}"
                    style="background-image: url('assets/sprites/{{p.img}}');">
                </div>
                <ion-label>{{p.originalOrder}} - {{p.name}} | ({{ p.interval/1000 }}seg)</ion-label>
            </ion-item>

            <ion-item-options>
                <ion-item-option color="success" (click)="play(p.slug, p.interval)">
                    <ion-col>
                        <ion-row style="display: block">
                            <ion-icon name="play" class="button-icon"></ion-icon>
                        </ion-row>
                        <ion-row>Play</ion-row>
                    </ion-col>
                </ion-item-option>
            </ion-item-options>
        </ion-item-sliding>

    </ion-list>
</ion-content>
