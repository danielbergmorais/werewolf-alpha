<ion-content [fullscreen]="true">
    <div class="container">
        <h3>Selecione a voz de narração</h3>
        <ion-segment [value]="voiceOption" (ionChange)="onVoiceChange($event)">
            <ion-segment-button value="narakeet">
                <ion-label>Felipe</ion-label>
            </ion-segment-button>
            <ion-segment-button value="ttsmp3">
                <ion-label>Onyx</ion-label>
            </ion-segment-button>
        </ion-segment>
        <h3>Escolha os Personagens</h3>
        <br>
    </div>

    <ion-list>
        <ion-item-sliding *ngFor="let p of charactersList">

            <ion-item>
                <div class="personagem mini" id="home_{{p.name}}" style="background-image: url('{{p.img}}');">
                </div>
                <ion-label>{{p.originalOrder}} - {{p.name}}</ion-label>
            </ion-item>

            <ion-item-options>
                <ion-item-option color="success" (click)="play(p.slug, p.interval)">
                    <ion-col>
                        <ion-row style="display: block">
                            <ion-icon name="play" class="button-icon"></ion-icon>
                        </ion-row>
                        <ion-row>Play</ion-row>
                    </ion-col>
                </ion-item-option>
                <!-- <ion-item-option color="danger" (click)="stop()">
                    <ion-col>
                        <ion-row style="display: block">
                            <ion-icon name="square" class="button-icon"></ion-icon>
                        </ion-row>
                        <ion-row>Stop</ion-row>
                    </ion-col>
                </ion-item-option> -->
            </ion-item-options>
        </ion-item-sliding>


    </ion-list>
</ion-content>
