<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>
            Werewolf
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

    <div class="container">
        <!-- <ion-button (click)="playDawn()">Iniciar vampiros</ion-button> -->
        <!-- <ion-button (click)="playNight()">Iniciar noite</ion-button> -->

        <!-- <ion-button (click)="loadPersonagens()" color="success">Recarregar</ion-button> -->
        <!-- <ion-button (click)="newPlay()" color="danger">NOVO PLAY</ion-button> -->
        <!-- <ion-button (click)="navigate()" color="warning">config</ion-button> -->

        <ion-button (click)="newPlay()" *ngIf="!playingAudio" color="success">
            <ion-col>
                <ion-row style="display: block">
                    <ion-icon name="play" class="button-icon"></ion-icon>
                </ion-row>
                <ion-row>Play</ion-row>
            </ion-col>
        </ion-button>

        <ion-button (click)="stop()" *ngIf="playingAudio" color="danger">
            <ion-col>
                <ion-row style="display: block">
                    <ion-icon name="square" class="button-icon"></ion-icon>
                </ion-row>
                <ion-row>Stop</ion-row>
            </ion-col>
        </ion-button>
    </div>

    <div class="container">
        <div *ngFor="let p of vampires">
            <div class="personagem" id="home_{{p.id}}" style="display: none">
                <img src={{p.img}} class="active" alt="">
                <img src={{p.img_grey}} class="inactive" alt="">
            </div>
        </div>
        <div *ngFor="let p of personagens">
            <div class="personagem" id="home_{{p.id}}" style="display: none">
                <img src={{p.img}} class="active" alt="">
                <img src={{p.img_grey}} class="inactive" alt="">
            </div>
        </div>
    </div>
</ion-content>
