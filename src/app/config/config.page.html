<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button></ion-back-button>
        </ion-buttons>
        <ion-title>Configurar</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="container">
        <div *ngFor="let c of characters">
            <div class="personagem" (click)="onSelect(c.name)" id="{{c.name}}">
                <img src={{c.img}}>
            </div>
        </div>
    </div>
</ion-content>
